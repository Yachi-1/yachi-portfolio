<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe</title>
<style>
  :root{
    --black:#1c1c1c;
    --gray-d:#7d7d7d;   /* primary text bars */
    --gray-m:#9a9a9a;   /* secondary text bars */
    --gray-l:#e7e7e7;   /* light placeholder fills / light bars */
    --gray-ll:#ececec;  /* placeholder box fill */
    --line:#d4d4d4;     /* borders + X strokes */
    --white:#ffffff;
  }

  *{box-sizing:border-box;border-radius:0 !important;margin:0;padding:0;}

  body{
    background:var(--white);
    color:var(--black);
    font-family:Helvetica,Arial,sans-serif; /* unused — no text */
    -webkit-font-smoothing:antialiased;
  }

  .page{max-width:1240px;margin:0 auto;}

  /* generic bars */
  .bar{display:block;height:14px;background:var(--gray-d);}
  .bar.m{background:var(--gray-m);}
  .bar.l{background:var(--gray-l);}
  .bar.k{background:var(--black);}

  /* image / media placeholder with X */
  .ph{
    background:var(--gray-ll);
    border:1px solid var(--line);
    position:relative;
  }
  .ph::before,.ph::after{
    content:"";position:absolute;inset:0;
  }
  .ph::before{
    background:linear-gradient(to top right,
      transparent calc(50% - 0.8px), var(--line) calc(50% - 0.8px),
      var(--line) calc(50% + 0.8px), transparent calc(50% + 0.8px));
  }
  .ph::after{
    background:linear-gradient(to top left,
      transparent calc(50% - 0.8px), var(--line) calc(50% - 0.8px),
      var(--line) calc(50% + 0.8px), transparent calc(50% + 0.8px));
  }

  /* squared buttons */
  .btn{height:46px;border:1px solid var(--line);background:var(--white);}
  .btn.k{background:var(--black);border-color:var(--black);}
  .btn.ghost{background:var(--white);border:1px solid var(--black);}

  .chip{height:40px;border:1px solid var(--line);background:var(--white);}
  .chip.k{background:var(--black);border-color:var(--black);}

  .square{border:2px solid var(--black);background:var(--white);}
  .cbox{border:1px solid var(--gray-d);background:var(--white);}

  section{padding:46px 40px;border-bottom:1px solid var(--line);}

  /* ---------- HEADER ---------- */
  .header{display:flex;align-items:center;justify-content:space-between;
          padding:24px 40px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:20px;}
  .brand .square{width:36px;height:36px;}
  .brand .bar{width:150px;height:20px;background:var(--gray-l);}
  .nav{display:flex;gap:24px;}
  .nav .bar{width:56px;height:14px;background:var(--gray-d);}
  .header .btn{width:120px;}

  /* ---------- HERO ---------- */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;padding-top:60px;padding-bottom:60px;}
  .hero .eyebrow{width:230px;height:16px;background:var(--gray-l);margin-bottom:22px;}
  .hero .h1{height:42px;background:var(--black);margin-bottom:14px;}
  .hero .h1.a{width:100%;}
  .hero .h1.b{width:72%;}
  .hero .copy{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
  .hero .copy .bar{height:13px;background:var(--gray-d);}
  .hero .copy .bar.s{width:78%;}
  .hero .cta{display:flex;gap:22px;margin-top:36px;}
  .hero .cta .btn{width:170px;}
  .hero .cta .btn.ghost{width:130px;}
  .hero .ph{aspect-ratio:4/3;}

  /* section heading row */
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;}
  .shead .left{display:flex;align-items:center;gap:18px;}
  .shead .square{width:26px;height:26px;border-width:1px;}
  .shead .title{width:300px;height:24px;background:var(--gray-l);}
  .shead .right{width:150px;height:16px;background:var(--gray-l);}

  /* ---------- GRID SECTION ---------- */
  .filters{display:flex;gap:18px;margin-bottom:34px;}
  .filters .chip{width:96px;}
  .filters .chip:first-child{width:70px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;}
  .card .ph{aspect-ratio:16/11;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;}
  .card .ph .lbl{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;}
  .card .ph .lbl .bar{height:12px;background:var(--gray-d);}
  .card .ph .lbl .bar:first-child{width:62%;}
  .card .ph .lbl .bar:last-child{width:36%;background:var(--gray-m);}
  .loadmore{display:flex;justify-content:center;margin-top:40px;}
  .loadmore .btn{width:150px;}

  /* ---------- LIST + DETAIL ---------- */
  .ld{display:grid;grid-template-columns:1fr 1.15fr;gap:48px;align-items:start;}
  .list .row{display:flex;align-items:center;gap:22px;padding:16px 14px;border-bottom:1px solid var(--line);}
  .list .row .cbox{width:24px;height:24px;flex:0 0 auto;}
  .list .row .bar{flex:1;height:14px;background:var(--gray-d);}
  .list .row.active{background:var(--gray-l);border-bottom:none;}
  .list .row.active .bar{background:var(--black);}
  .detail{border:1px solid var(--line);padding:40px;}
  .detail .label{width:140px;height:16px;background:var(--gray-l);margin-bottom:20px;}
  .detail .dh{width:62%;height:26px;background:var(--gray-d);margin-bottom:30px;}
  .detail .lines{display:flex;flex-direction:column;gap:14px;margin-bottom:34px;}
  .detail .lines .bar{height:14px;background:var(--gray-d);}
  .detail .lines .bar.s{width:64%;}
  .detail .btn{width:150px;}

  /* ---------- BENTO ---------- */
  .bento{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:30px;}
  .bento .ph{width:100%;height:100%;}
  .bento .b1{aspect-ratio:auto;min-height:240px;}
  .bento .b2{min-height:240px;}
  .bento .b3{min-height:240px;}
  .bento .b4{min-height:240px;}
  /* arrange: b1 top-left (wide), b2 top-right, b3 bottom-left (narrow), b4 bottom-right (wide) */
  .bento .b1{grid-column:1;grid-row:1;}
  .bento .b2{grid-column:2;grid-row:1;}
  .bento .b3{grid-column:1;grid-row:2;width:55%;}
  .bento .b4{grid-column:1 / span 2;grid-row:2;margin-left:auto;width:64%;}

  /* ---------- FOOTER ---------- */
  .footer{display:flex;align-items:flex-start;justify-content:space-between;padding:48px 40px;border-bottom:none;}
  .footer .fbrand{display:flex;flex-direction:column;gap:12px;}
  .footer .fbrand .bar.a{width:230px;height:24px;background:var(--gray-l);}
  .footer .fbrand .bar.b{width:230px;height:12px;background:var(--gray-m);}
  .fcols{display:flex;gap:60px;}
  .fcol{display:flex;flex-direction:column;gap:11px;width:96px;}
  .fcol .bar.head{height:14px;background:var(--black);width:70%;}
  .fcol .bar{height:11px;background:var(--gray-m);}

  @media(max-width:820px){
    .hero,.ld,.bento{grid-template-columns:1fr;}
    .grid{grid-template-columns:1fr 1fr;}
    .bento{grid-template-rows:auto;}
    .bento .b1,.bento .b2,.bento .b3,.bento .b4{grid-column:1 !important;width:100% !important;margin:0 !important;}
    .nav{display:none;}
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <span class="square"></span>
      <span class="bar"></span>
    </div>
    <nav class="nav">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </nav>
    <span class="btn"></span>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div>
      <span class="eyebrow"></span>
      <span class="h1 a"></span>
      <span class="h1 b"></span>
      <div class="copy">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar s"></span>
      </div>
      <div class="cta">
        <span class="btn k"></span>
        <span class="btn ghost"></span>
      </div>
    </div>
    <div class="ph"></div>
  </section>

  <!-- GRID -->
  <section>
    <div class="shead">
      <div class="left">
        <span class="square"></span>
        <span class="title"></span>
      </div>
      <span class="right"></span>
    </div>
    <div class="filters">
      <span class="chip k"></span>
      <span class="chip"></span>
      <span class="chip"></span>
      <span class="chip"></span>
      <span class="chip"></span>
      <span class="chip"></span>
    </div>
    <div class="grid">
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
      <div class="card"><div class="ph"><div class="lbl"><span class="bar"></span><span class="bar"></span></div></div></div>
    </div>
    <div class="loadmore"><span class="btn"></span></div>
  </section>

  <!-- LIST + DETAIL -->
  <section>
    <div class="shead">
      <div class="left">
        <span class="square"></span>
        <span class="title"></span>
      </div>
      <span class="right"></span>
    </div>
    <div class="ld">
      <div class="list">
        <div class="row active"><span class="cbox"></span><span class="bar"></span></div>
        <div class="row"><span class="cbox"></span><span class="bar"></span></div>
        <div class="row"><span class="cbox"></span><span class="bar"></span></div>
        <div class="row"><span class="cbox"></span><span class="bar"></span></div>
        <div class="row"><span class="cbox"></span><span class="bar"></span></div>
        <div class="row"><span class="cbox"></span><span class="bar"></span></div>
      </div>
      <div class="detail">
        <span class="label"></span>
        <span class="dh"></span>
        <div class="lines">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar s"></span>
        </div>
        <span class="btn"></span>
      </div>
    </div>
  </section>

  <!-- BENTO -->
  <section>
    <div class="shead">
      <div class="left">
        <span class="square"></span>
        <span class="title"></span>
      </div>
      <span class="right"></span>
    </div>
    <div class="bento">
      <div class="ph b1"></div>
      <div class="ph b2"></div>
      <div class="ph b3"></div>
      <div class="ph b4"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="fbrand">
      <span class="bar a"></span>
      <span class="bar b"></span>
    </div>
    <div class="fcols">
      <div class="fcol"><span class="bar head"></span><span class="bar"></span><span class="bar"></span></div>
      <div class="fcol"><span class="bar head"></span><span class="bar"></span><span class="bar"></span></div>
      <div class="fcol"><span class="bar head"></span><span class="bar"></span><span class="bar"></span></div>
    </div>
  </footer>

</div>
</body>
</html>
